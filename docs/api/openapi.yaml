openapi: 3.0.3
info:
  title: Chronos API
  version: 0.1.0
  description: Prototype job and workflow scheduler API.
servers:
  - url: http://localhost:18080
paths:
  /api/jobs:
    get:
      summary: List job definitions
      responses:
        '200':
          description: Job definitions
    post:
      summary: Create a job definition
      responses:
        '201':
          description: Created
  /api/runs:
    get:
      summary: List job runs
      responses:
        '200':
          description: Job runs
