services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: chronos
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronos"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      args:
        MODULE: api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/chronos
      DB_USER: chronos
      DB_PASSWORD: chronos
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18080:8080"
    restart: on-failure

  scheduler:
    build:
      context: .
      args:
        MODULE: scheduler
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/chronos
      DB_USER: chronos
      DB_PASSWORD: chronos
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  worker1:
    build:
      context: .
      args:
        MODULE: worker
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/chronos
      DB_USER: chronos
      DB_PASSWORD: chronos
      WORKER_ID: worker-1
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  worker2:
    build:
      context: .
      args:
        MODULE: worker
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/chronos
      DB_USER: chronos
      DB_PASSWORD: chronos
      WORKER_ID: worker-2
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  worker3:
    build:
      context: .
      args:
        MODULE: worker
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/chronos
      DB_USER: chronos
      DB_PASSWORD: chronos
      WORKER_ID: worker-3
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "15173:80"
    depends_on:
      api:
        condition: service_started
    restart: on-failure

  prometheus:
    image: prom/prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "19090:9090"

  grafana:
    image: grafana/grafana-oss
    ports:
      - "13000:3000"
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning
